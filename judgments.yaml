# Relevance judgments for the 16 queries in queries.txt, against outputs/output_N.txt.
#
# `relevant` lists the RANKS (1-based, as printed in the output file) of results judged
# to actually answer the query. Every other rank up to the last relevant one counts as
# incorrect. Ranks are stable as long as the outputs are not regenerated -- re-run
# run_queries.py and these must be re-judged.
#
# Judged by reading title + author for all 100 results of every query. Where a title
# alone could not settle it, the book was judged NOT relevant, so these numbers are a
# floor rather than a best case.
#
# Judging rules applied, per query type:
#   * topical match with the *specific* ask, not the general subject. A generic
#     মুক্তিযুদ্ধের গল্প collection does not answer "নারী মুক্তিযোদ্ধাদের গল্প".
#   * form matters when the query names one: কবিতা means a poetry book, not criticism
#     about poetry; কিশোর উপন্যাস means juvenile fiction, so কিশোর *ইতিহাস* is excluded.
#   * place matters when the query names one: only books on districts inside Khulna
#     division count for query 13.
#   * English editions and translations of a relevant Bengali book count as relevant.

1:
  query: নারী মুক্তিযোদ্ধাদের গল্প
  note: women in the 1971 war -- fighters, বীরাঙ্গনা, women's war narratives.
  relevant: [1, 4, 5, 7, 8, 9, 10, 11, 12, 13, 15, 22, 31, 32, 35, 37, 38, 39, 40, 42,
             43, 44, 45, 46, 49, 50, 51, 52, 53, 56, 57, 58, 59, 60, 61, 62, 65, 66,
             67, 68, 69, 70, 72, 73, 74, 75, 76, 77, 80, 81, 82, 93, 100]

2:
  query: জেলা পর্যায়ের মুক্তিযুদ্ধ
  note: the war in a named district or division, not the war in general.
  relevant: [1, 2, 3, 4, 6, 7, 8, 10, 32, 39, 41, 45, 49, 74, 91]

3:
  query: গেরিলা মুক্তিযোদ্ধাদের জীবনী
  note: memoirs and biographies of fighters/commanders. Fiction and general
    histories excluded; Che Guevara's guerrilla memoirs are not মুক্তিযোদ্ধা.
  relevant: [1, 2, 3, 4, 5, 7, 8, 9, 13, 14, 15, 18, 22, 24, 25, 28, 30, 31, 32, 33,
             40, 42, 44, 46, 48, 49, 50, 51, 53, 56, 59, 60, 61, 64, 65, 67, 69, 73,
             76, 79, 80, 82, 83, 85, 87, 93, 94, 96, 97, 98]

4:
  query: দেশপ্রেমের কবিতা
  note: must be a book of poetry/ছড়া/কাব্য on a patriotic or war theme. Criticism
    about poetry, and prose on the same subject, are excluded.
  relevant: [2, 3, 5, 8, 9, 10, 13, 16, 35, 39, 42, 43, 44, 48, 50, 54, 55, 57, 58,
             59, 60, 61, 63, 64, 68, 72, 78, 89, 90]

5:
