<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#173f35">
  <meta name="description" content="বাংলা বইয়ের ক্যাটালগে সহজ ভাষায় খুঁজুন">
  <title>বইখোঁজ — বাংলা বই আবিষ্কার</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#content">মূল অংশে যান</a>
  <header class="site-header">
    <a class="brand" href="/" data-link aria-label="বইখোঁজ প্রথম পাতা">
      <span class="brand-mark" aria-hidden="true">ব</span>
      <span>বইখোঁজ<small>বাংলা বই আবিষ্কার</small></span>
    </a>
    <form class="header-search" id="header-search" role="search" hidden>
      <label class="sr-only" for="header-query">বই খুঁজুন</label>
      <input id="header-query" name="q" type="search" maxlength="300"
             placeholder="শিরোনাম, লেখক বা বিষয়…" autocomplete="off">
      <button type="submit">খুঁজুন</button>
    </form>
    <a class="catalog-link" href="/?browse=1" data-link>সব বই</a>
  </header>

  <main id="content" tabindex="-1"></main>
  <div id="announcer" class="sr-only" role="status" aria-live="polite"></div>

  <footer class="site-footer">
    <p>ক্যাটালগের তথ্যের ভিত্তিতে বই খোঁজা ও আবিষ্কার</p>
  </footer>

  <template id="book-card-template">
    <article class="book-card">
      <a class="cover-link" data-book-link>
        <div class="cover placeholder"><span class="cover-letter"></span></div>
      </a>
      <div class="book-copy">
        <p class="eyebrow card-rank"></p>
        <h3><a data-book-link class="book-title"></a></h3>
        <p class="book-author"></p>
        <p class="book-meta"></p>
        <blockquote class="match-excerpt" hidden></blockquote>
        <p class="book-description"></p>
        <div class="tag-row"></div>
        <a class="detail-link" data-book-link>বিস্তারিত দেখুন <span aria-hidden="true">→</span></a>
      </div>
    </article>
  </template>
</body>
</html>
