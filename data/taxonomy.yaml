periods:
  # Ranges are inclusive and must NOT overlap: a year that falls in two periods is
  # resolved by whichever the loader happened to see first, which made 1971 -- the most
  # common publication year in this catalogue -- land in a period chosen by dict order.
  # Boundary years are assigned by history: 1947 is Partition, and 1971 is the war,
  # which `মুক্তিযুদ্ধ` above already files under পাকিস্তান আমল.
  প্রাচীন যুগ:
