# নিয়ন্ত্রিত শব্দভাণ্ডার (controlled vocabulary).
#
# The canonical form is the YAML key; `aliases` are every spelling/synonym that should
# collapse onto it. This file is meant to be curated by hand -- the design doc calls for
# high-value categories (১৯৭১, ভাষা আন্দোলন, দেশভাগ, পাকিস্তান আমল, কূটনীতি, স্মৃতিকথা,
# রাজনৈতিক ইতিহাস) to be reviewed manually so their precision stays high.
#
# Matching is done on the *analysed* form (see bengali.analyze), so inflected variants
# such as "মুক্তিযুদ্ধের" already resolve without being listed.
#
# It does double duty: every entry is both a tag applied to books during enrichment and a
# query-expansion rule at search time. Adding a concept here improves recall on the next
# `build-index` with no re-enrichment run, because `derive.py` re-tags from this file on
# every load.
#
# Concepts below the first block were added after mining the catalogue for frequent terms
# the vocabulary did not cover (see the note in README).

